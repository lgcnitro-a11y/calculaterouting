<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transportförsening – kalkylator</title>
<style>
  :root {
    --bg:#0f172a; --panel:#1e293b; --panel2:#334155; --border:#475569;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#22c55e;
    --warn:#f59e0b; --bad:#ef4444;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--panel); padding:12px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; }
  nav button { background:transparent; color:var(--text); border:1px solid var(--border); padding:6px 12px; border-radius:6px; cursor:pointer; }
  nav button.active { background:var(--accent); color:#0f172a; border-color:var(--accent); }
  .io { margin-left:auto; display:flex; gap:8px; }
  main { padding:20px; max-width:1200px; margin:0 auto; }
  section { display:none; }
  section.active { display:block; }
  h2 { margin-top:0; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:140px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input, select, textarea, button { font:inherit; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--panel2); color:var(--text); width:100%; }
  button { cursor:pointer; background:var(--accent); color:#0f172a; border:none; font-weight:600; }
  button.secondary { background:var(--panel2); color:var(--text); border:1px solid var(--border); font-weight:400; }
  button.danger { background:var(--bad); color:white; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--border); font-size:14px; vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  .weekdays { display:flex; gap:4px; flex-wrap:wrap; }
  .weekdays label { display:flex; align-items:center; gap:4px; background:var(--panel2); padding:4px 8px; border-radius:4px; cursor:pointer; margin:0; font-size:13px; color:var(--text); }
  .weekdays input { width:auto; }
  .leg { background:var(--panel2); border:1px solid var(--border); border-radius:6px; padding:12px; margin-bottom:8px; }
  .leg-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .leg-type { font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:1px; }
  .delta-ok { color:var(--ok); font-weight:600; }
  .delta-warn { color:var(--warn); font-weight:600; }
  .delta-bad { color:var(--bad); font-weight:600; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; background:var(--panel2); }
  .timeline { font-family:ui-monospace,monospace; font-size:13px; }
  .timeline-row { display:grid; grid-template-columns:24px 1fr 110px 110px 100px; gap:8px; padding:6px 0; border-bottom:1px dashed var(--border); align-items:center; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--muted); margin:0 auto; }
  .dot.ok { background:var(--ok); }
  .dot.warn { background:var(--warn); }
  .dot.bad { background:var(--bad); }
  .summary { padding:12px; border-radius:6px; margin-bottom:12px; }
  .summary.ok { background:rgba(34,197,94,.15); border:1px solid var(--ok); }
  .summary.bad { background:rgba(239,68,68,.15); border:1px solid var(--bad); }
  .grow0 { flex:0 0 auto; min-width:auto; }
</style>
</head>
<body>
<header>
  <h1>🚚 Transportförsening</h1>
  <nav>
    <button data-tab="carriers" class="active">Utförare</button>
    <button data-tab="lines">Linjer</button>
    <button data-tab="transports">Transporter</button>
    <button data-tab="analyze">Analys</button>
  </nav>
  <div class="io">
    <button class="secondary" id="exportBtn">Exportera</button>
    <button class="secondary" id="importBtn">Importera</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>
</header>

<main>

<!-- ============ UTFÖRARE ============ -->
<section id="tab-carriers" class="active">
  <h2>Utförare</h2>
  <div class="card">
    <h3 id="carrierFormTitle">Ny utförare</h3>
    <div class="row">
      <div><label>Namn</label><input id="carrierName" placeholder="t.ex. DHL"></div>
      <div><label>Kommentar</label><input id="carrierNote" placeholder="valfritt"></div>
    </div>
    <div style="margin-top:12px; display:flex; gap:8px;">
      <button id="saveCarrierBtn">Spara utförare</button>
      <button class="secondary" id="cancelCarrierBtn" style="display:none">Avbryt</button>
    </div>
  </div>
  <div class="card">
    <h3>Sparade utförare</h3>
    <table id="carriersTable">
      <thead><tr><th>Namn</th><th>Kommentar</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<!-- ============ LINJER ============ -->
<section id="tab-lines">
  <h2>Linjeregister</h2>
  <div class="card">
    <h3 id="lineFormTitle">Ny linje</h3>
    <div class="row">
      <div><label>Namn / linjenr</label><input id="lineName" placeholder="t.ex. L101"></div>
      <div><label>Utförare</label><select id="lineCarrier"></select></div>
    </div>
    <div class="row">
      <div><label>Från terminal</label><input id="lineFrom" placeholder="Göteborg"></div>
      <div><label>Till terminal</label><input id="lineTo" placeholder="Stockholm"></div>
    </div>
    <div class="row">
      <div><label>Avgångstid</label><input type="time" id="lineDep"></div>
      <div><label>Ankomsttid</label><input type="time" id="lineArr"></div>
      <div class="grow0"><label>Ankomst dag</label>
        <select id="lineArrOffset" style="width:auto"><option value="0">samma dag</option><option value="1" selected>+1 dag</option><option value="2">+2 dagar</option></select>
      </div>
    </div>
    <label style="margin-top:8px">Trafikeras (veckodagar)</label>
    <div class="weekdays" id="lineDays"></div>
    <div style="margin-top:12px; display:flex; gap:8px;">
      <button id="saveLineBtn">Spara linje</button>
      <button class="secondary" id="cancelLineBtn" style="display:none">Avbryt</button>
    </div>
  </div>

  <div class="card">
    <h3>Sparade linjer</h3>
    <table id="linesTable">
      <thead><tr><th>Linje</th><th>Sträcka</th><th>Tid</th><th>Dagar</th><th>Utförare</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<!-- ============ TRANSPORTER ============ -->
<section id="tab-transports">
  <h2>Transporter</h2>
  <div class="card">
    <h3 id="trFormTitle">Ny transport</h3>
    <div class="row">
      <div><label>Referens / sändningsnr</label><input id="trRef" placeholder="SE12345"></div>
    </div>

    <h4>1. Hämtning</h4>
    <div class="row">
      <div><label>Utförare</label><select id="puCarrier"></select></div>
      <div><label>Datum</label><input type="date" id="puDate"></div>
    </div>

    <h4>2. Linjer</h4>
    <div id="legsContainer"></div>
    <button class="secondary" id="addLegBtn" style="margin-top:8px">+ Lägg till linje</button>

    <h4>3. Utkörning</h4>
    <div class="row">
      <div><label>Utförare</label><select id="doCarrier"></select></div>
      <div><label>Datum</label><input type="date" id="doDate"></div>
    </div>

    <div style="margin-top:16px; display:flex; gap:8px;">
      <button id="saveTrBtn">Spara transport</button>
      <button class="secondary" id="cancelTrBtn" style="display:none">Avbryt</button>
    </div>
  </div>

  <div class="card">
    <h3>Sparade transporter</h3>
    <table id="trTable">
      <thead><tr><th>Ref</th><th>Hämtning</th><th>Linjer</th><th>Utkörning</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<!-- ============ ANALYS ============ -->
<section id="tab-analyze">
  <h2>Analys av skanningspunkter</h2>
  <div class="card">
    <label>Välj transport</label>
    <select id="analyzeSelect"></select>
  </div>
  <div id="analyzeOutput"></div>
</section>

</main>

<script>
// ============ STATE & STORAGE ============
const STORAGE_KEY = 'transportDelayApp.v1';
const DAYS_SV = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön']; // ISO 1-7

let state = {
  carriers: [],   // {id, name, note}
  lines: [],      // {id, name, carrierId, from, to, dep, arr, arrOffset, days:[1..7]}
  transports: [], // {id, ref, pickup:{carrierId,date}, legs:[{lineId,date}], delivery:{carrierId,date}, scans}
};

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch (e) { console.error(e); }
  if (!state.carriers) state.carriers = [];
  if (!state.lines) state.lines = [];
  if (!state.transports) state.transports = [];
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// ============ TABS ============
document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'analyze') renderAnalyze();
    if (btn.dataset.tab === 'transports') renderTransports();
    if (btn.dataset.tab === 'lines') renderLines();
    if (btn.dataset.tab === 'carriers') renderCarriers();
  };
});

// ============ EXPORT / IMPORT ============
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'transport-data-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
};
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data.lines || !data.transports) throw new Error('Ogiltigt format');
      if (!confirm('Skriv över nuvarande data?')) return;
      state = data; save(); renderAll();
    } catch (err) { alert('Importfel: ' + err.message); }
  };
  r.readAsText(f);
};

// ============ CARRIERS ============
let editingCarrierId = null;

function carrierOptions(selectedId) {
  return ['<option value="">– välj utförare –</option>']
    .concat(state.carriers.map(c => `<option value="${c.id}" ${c.id===selectedId?'selected':''}>${esc(c.name)}</option>`))
    .join('');
}
function carrierName(id) {
  const c = state.carriers.find(x => x.id === id);
  return c ? c.name : '';
}
function refreshCarrierDropdowns() {
  ['lineCarrier','puCarrier','doCarrier'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const cur = el.value;
    el.innerHTML = carrierOptions(cur);
  });
}

document.getElementById('saveCarrierBtn').onclick = () => {
  const name = document.getElementById('carrierName').value.trim();
  const note = document.getElementById('carrierNote').value.trim();
  if (!name) { alert('Ange namn'); return; }
  if (editingCarrierId) {
    const i = state.carriers.findIndex(c => c.id === editingCarrierId);
    state.carriers[i] = { ...state.carriers[i], name, note };
  } else {
    state.carriers.push({ id: uid(), name, note });
  }
  save(); clearCarrierForm(); renderCarriers(); refreshCarrierDropdowns();
};
document.getElementById('cancelCarrierBtn').onclick = () => clearCarrierForm();

function clearCarrierForm() {
  editingCarrierId = null;
  document.getElementById('carrierFormTitle').textContent = 'Ny utförare';
  document.getElementById('carrierName').value = '';
  document.getElementById('carrierNote').value = '';
  document.getElementById('cancelCarrierBtn').style.display = 'none';
}
function renderCarriers() {
  const tb = document.querySelector('#carriersTable tbody');
  tb.innerHTML = '';
  if (state.carriers.length === 0) {
    tb.innerHTML = '<tr><td colspan="3" class="muted">Inga utförare än</td></tr>';
    return;
  }
  state.carriers.forEach(c => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${esc(c.name)}</strong></td>
      <td>${esc(c.note||'')}</td>
      <td style="text-align:right">
        <button class="secondary" data-edit="${c.id}">Ändra</button>
        <button class="danger" data-del="${c.id}">Ta bort</button>
      </td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const c = state.carriers.find(x => x.id === b.dataset.edit);
    editingCarrierId = c.id;
    document.getElementById('carrierFormTitle').textContent = 'Ändra utförare';
    document.getElementById('carrierName').value = c.name;
    document.getElementById('carrierNote').value = c.note||'';
    document.getElementById('cancelCarrierBtn').style.display = 'inline-block';
    window.scrollTo(0,0);
  });
  tb.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('Ta bort utförare? Linjer/transporter som använder den behåller referens men visas tomma.')) return;
    state.carriers = state.carriers.filter(c => c.id !== b.dataset.del);
    save(); renderCarriers(); refreshCarrierDropdowns(); renderLines(); renderTransports();
  });
}

// ============ LINES ============
let editingLineId = null;

function renderWeekdayPicker() {
  const c = document.getElementById('lineDays');
  c.innerHTML = '';
  DAYS_SV.forEach((d,i) => {
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="checkbox" value="${i+1}" checked> ${d}`;
    c.appendChild(lbl);
  });
}

function getLineFormData() {
  const days = [...document.querySelectorAll('#lineDays input:checked')].map(c => +c.value);
  return {
    name: document.getElementById('lineName').value.trim(),
    carrierId: document.getElementById('lineCarrier').value,
    from: document.getElementById('lineFrom').value.trim(),
    to: document.getElementById('lineTo').value.trim(),
    dep: document.getElementById('lineDep').value,
    arr: document.getElementById('lineArr').value,
    arrOffset: +document.getElementById('lineArrOffset').value,
    days,
  };
}
function setLineForm(l) {
  document.getElementById('lineName').value = l.name || '';
  document.getElementById('lineCarrier').innerHTML = carrierOptions(l.carrierId);
  document.getElementById('lineFrom').value = l.from || '';
  document.getElementById('lineTo').value = l.to || '';
  document.getElementById('lineDep').value = l.dep || '';
  document.getElementById('lineArr').value = l.arr || '';
  document.getElementById('lineArrOffset').value = l.arrOffset ?? 1;
  document.querySelectorAll('#lineDays input').forEach(c => c.checked = l.days ? l.days.includes(+c.value) : true);
}
function clearLineForm() {
  editingLineId = null;
  document.getElementById('lineFormTitle').textContent = 'Ny linje';
  setLineForm({days:[1,2,3,4,5,6,7]});
  ['lineName','lineFrom','lineTo','lineDep','lineArr'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('lineCarrier').innerHTML = carrierOptions('');
  document.getElementById('lineArrOffset').value = 1;
  document.querySelectorAll('#lineDays input').forEach(c => c.checked = true);
  document.getElementById('cancelLineBtn').style.display = 'none';
}

document.getElementById('saveLineBtn').onclick = () => {
  const d = getLineFormData();
  if (!d.name || !d.from || !d.to || !d.dep || !d.arr) { alert('Fyll i namn, terminaler och tider'); return; }
  if (editingLineId) {
    const i = state.lines.findIndex(l => l.id === editingLineId);
    state.lines[i] = { ...state.lines[i], ...d };
  } else {
    state.lines.push({ id: uid(), ...d });
  }
  save(); clearLineForm(); renderLines();
};
document.getElementById('cancelLineBtn').onclick = clearLineForm;

function renderLines() {
  const tb = document.querySelector('#linesTable tbody');
  tb.innerHTML = '';
  if (state.lines.length === 0) {
    tb.innerHTML = '<tr><td colspan="6" class="muted">Inga linjer än</td></tr>';
    return;
  }
  state.lines.forEach(l => {
    const tr = document.createElement('tr');
    const daysTxt = l.days.length === 7 ? 'Alla' : l.days.map(d => DAYS_SV[d-1]).join(',');
    const arrTxt = l.arr + (l.arrOffset ? ` (+${l.arrOffset}d)` : '');
    tr.innerHTML = `
      <td><strong>${esc(l.name)}</strong></td>
      <td>${esc(l.from)} → ${esc(l.to)}</td>
      <td>${l.dep} – ${arrTxt}</td>
      <td>${daysTxt}</td>
      <td>${esc(carrierName(l.carrierId))}</td>
      <td style="text-align:right">
        <button class="secondary" data-edit="${l.id}">Ändra</button>
        <button class="danger" data-del="${l.id}">Ta bort</button>
      </td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const l = state.lines.find(x => x.id === b.dataset.edit);
    editingLineId = l.id;
    document.getElementById('lineFormTitle').textContent = 'Ändra linje';
    setLineForm(l);
    document.getElementById('cancelLineBtn').style.display = 'inline-block';
    window.scrollTo(0,0);
  });
  tb.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('Ta bort linjen?')) return;
    state.lines = state.lines.filter(l => l.id !== b.dataset.del);
    save(); renderLines();
  });
}

// ============ TRANSPORTS ============
let editingTrId = null;
let formLegs = []; // [{lineId, date}]

document.getElementById('addLegBtn').onclick = () => {
  formLegs.push({ lineId:'', date:'' });
  renderLegs();
};

function renderLegs() {
  const c = document.getElementById('legsContainer');
  c.innerHTML = '';
  if (formLegs.length === 0) {
    c.innerHTML = '<div class="muted">Inga linjer tillagda</div>';
    return;
  }
  formLegs.forEach((leg, idx) => {
    const div = document.createElement('div');
    div.className = 'leg';
    const opts = ['<option value="">– välj linje –</option>']
      .concat(state.lines.map(l => `<option value="${l.id}" ${l.id===leg.lineId?'selected':''}>${esc(l.name)} | ${esc(l.from)}→${esc(l.to)} (${l.dep}–${l.arr})</option>`))
      .join('');
    div.innerHTML = `
      <div class="leg-head">
        <span class="leg-type">Linje ${idx+1}</span>
        <button class="danger" data-rm="${idx}" style="width:auto; padding:4px 8px;">Ta bort</button>
      </div>
      <div class="row">
        <div style="flex:2"><label>Linje</label><select data-leg-line="${idx}">${opts}</select></div>
        <div><label>Avgångsdatum</label><input type="date" data-leg-date="${idx}" value="${leg.date||''}"></div>
      </div>
      <div class="muted" id="legPreview-${idx}" style="margin-top:6px"></div>
    `;
    c.appendChild(div);
    updateLegPreview(idx);
  });
  c.querySelectorAll('[data-leg-line]').forEach(sel => sel.onchange = () => {
    formLegs[+sel.dataset.legLine].lineId = sel.value;
    updateLegPreview(+sel.dataset.legLine);
  });
  c.querySelectorAll('[data-leg-date]').forEach(inp => inp.onchange = () => {
    formLegs[+inp.dataset.legDate].date = inp.value;
    updateLegPreview(+inp.dataset.legDate);
  });
  c.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    formLegs.splice(+b.dataset.rm, 1); renderLegs();
  });
}
function updateLegPreview(idx) {
  const leg = formLegs[idx];
  const el = document.getElementById('legPreview-' + idx);
  if (!el) return;
  if (!leg.lineId || !leg.date) { el.textContent = ''; return; }
  const line = state.lines.find(l => l.id === leg.lineId);
  if (!line) return;
  const dep = combineDateTime(leg.date, line.dep, 0);
  const arr = combineDateTime(leg.date, line.arr, line.arrOffset||0);
  const iso = (d) => d.toISOString().slice(0,16).replace('T',' ');
  el.textContent = `Planerad: avgång ${iso(dep)} → ankomst ${iso(arr)}`;
}

document.getElementById('saveTrBtn').onclick = () => {
  const t = {
    id: editingTrId || uid(),
    ref: document.getElementById('trRef').value.trim(),
    pickup: {
      carrierId: document.getElementById('puCarrier').value,
      date: document.getElementById('puDate').value,
    },
    legs: formLegs.filter(l => l.lineId && l.date),
    delivery: {
      carrierId: document.getElementById('doCarrier').value,
      date: document.getElementById('doDate').value,
    },
    scans: editingTrId ? (state.transports.find(x=>x.id===editingTrId)?.scans||[]) : [],
  };
  if (!t.ref) { alert('Ange referensnummer'); return; }
  if (editingTrId) {
    const i = state.transports.findIndex(x => x.id === editingTrId);
    state.transports[i] = t;
  } else {
    state.transports.push(t);
  }
  save(); clearTrForm(); renderTransports();
};
document.getElementById('cancelTrBtn').onclick = clearTrForm;

function clearTrForm() {
  editingTrId = null;
  formLegs = [];
  document.getElementById('trFormTitle').textContent = 'Ny transport';
  ['trRef','puDate','doDate'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('puCarrier').innerHTML = carrierOptions('');
  document.getElementById('doCarrier').innerHTML = carrierOptions('');
  renderLegs();
  document.getElementById('cancelTrBtn').style.display = 'none';
}
function loadTrForm(t) {
  editingTrId = t.id;
  document.getElementById('trFormTitle').textContent = 'Ändra transport';
  document.getElementById('trRef').value = t.ref;
  document.getElementById('puCarrier').innerHTML = carrierOptions(t.pickup.carrierId||'');
  document.getElementById('doCarrier').innerHTML = carrierOptions(t.delivery.carrierId||'');
  document.getElementById('puDate').value = t.pickup.date||'';
  document.getElementById('doDate').value = t.delivery.date||'';
  formLegs = JSON.parse(JSON.stringify(t.legs||[]));
  renderLegs();
  document.getElementById('cancelTrBtn').style.display = 'inline-block';
  window.scrollTo(0,0);
}

function renderTransports() {
  const tb = document.querySelector('#trTable tbody');
  tb.innerHTML = '';
  if (state.transports.length === 0) {
    tb.innerHTML = '<tr><td colspan="5" class="muted">Inga transporter än</td></tr>';
    return;
  }
  state.transports.forEach(t => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${esc(t.ref)}</strong></td>
      <td>${esc(carrierName(t.pickup.carrierId))} ${t.pickup.date||''}</td>
      <td>${t.legs.map(l => {
        const line = state.lines.find(x=>x.id===l.lineId);
        return line ? `<span class="pill">${esc(line.name)} ${l.date}</span>` : '';
      }).join(' ')}</td>
      <td>${esc(carrierName(t.delivery.carrierId))} ${t.delivery.date||''}</td>
      <td style="text-align:right">
        <button class="secondary" data-edit="${t.id}">Ändra</button>
        <button class="secondary" data-analyze="${t.id}">Analys</button>
        <button class="danger" data-del="${t.id}">Ta bort</button>
      </td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    loadTrForm(state.transports.find(x => x.id === b.dataset.edit));
  });
  tb.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('Ta bort transport?')) return;
    state.transports = state.transports.filter(x => x.id !== b.dataset.del);
    save(); renderTransports();
  });
  tb.querySelectorAll('[data-analyze]').forEach(b => b.onclick = () => {
    document.querySelector('nav button[data-tab="analyze"]').click();
    document.getElementById('analyzeSelect').value = b.dataset.analyze;
    renderAnalyze();
  });
}

// ============ ANALYZE ============
function buildPlannedRoute(t) {
  // mode: 'time' = jämför datetime (min), 'date' = jämför endast datum (dagar)
  const pts = [];
  if (t.pickup.date) {
    pts.push({ type:'Hämtning', label:`Hämtning – ${carrierName(t.pickup.carrierId)||'?'}`, mode:'date',
      plannedDate: t.pickup.date, key:'pickup' });
  }
  t.legs.forEach((leg, i) => {
    const line = state.lines.find(l => l.id === leg.lineId);
    if (!line || !leg.date) return;
    pts.push({ type:`Linje ${line.name}`, label:`Avgång ${line.from}`, mode:'time',
      planned: combineDateTime(leg.date, line.dep, 0), key:`leg-${i}-dep` });
    pts.push({ type:`Linje ${line.name}`, label:`Ankomst ${line.to}`, mode:'time',
      planned: combineDateTime(leg.date, line.arr, line.arrOffset||0), key:`leg-${i}-arr` });
  });
  if (t.delivery.date) {
    pts.push({ type:'Utkörning', label:`Utkörning – ${carrierName(t.delivery.carrierId)||'?'}`, mode:'date',
      plannedDate: t.delivery.date, key:'delivery' });
  }
  return pts;
}

function renderAnalyze() {
  const sel = document.getElementById('analyzeSelect');
  sel.innerHTML = '<option value="">– välj transport –</option>' +
    state.transports.map(t => `<option value="${t.id}">${esc(t.ref)}</option>`).join('');
  sel.onchange = () => renderAnalyzeFor(sel.value);
  if (sel.value) renderAnalyzeFor(sel.value);
  else document.getElementById('analyzeOutput').innerHTML = '';
}
function renderAnalyzeFor(id) {
  const out = document.getElementById('analyzeOutput');
  const t = state.transports.find(x => x.id === id);
  if (!t) { out.innerHTML = ''; return; }
  const route = buildPlannedRoute(t);
  if (!t.scans) t.scans = [];
  // Sync scans with route
  const scanMap = Object.fromEntries(t.scans.map(s => [s.key, s]));
  route.forEach(p => { if (!scanMap[p.key]) scanMap[p.key] = { key:p.key, actual:'' }; });

  let firstDelayKey = null;
  let firstDelayMin = 0;
  let totalDelay = 0;

  const rows = route.map(p => {
    const s = scanMap[p.key];
    let deltaMin = null, deltaDays = null, delayed = false, plannedMs = null, actualMs = null;
    if (p.mode === 'time') {
      plannedMs = p.planned.getTime();
      if (s.actual) {
        const actual = new Date(s.actual);
        actualMs = actual.getTime();
        deltaMin = Math.round((actual - p.planned) / 60000);
        delayed = deltaMin > 15;
      }
    } else {
      const [y,m,d] = p.plannedDate.split('-').map(Number);
      plannedMs = new Date(y, m-1, d, 12, 0).getTime();
      if (s.actual) {
        const [ay,am,ad] = s.actual.split('-').map(Number);
        actualMs = new Date(ay, am-1, ad, 12, 0).getTime();
        deltaDays = Math.round((actualMs - plannedMs) / 86400000);
        delayed = deltaDays > 0;
      }
    }
    if (delayed && firstDelayKey === null) { firstDelayKey = p.key; }
    return { p, s, deltaMin, deltaDays, delayed, plannedMs, actualMs };
  });

  // Beräkna inkrementell försening mellan på varandra följande skanningspunkter
  const scanned = rows.filter(r => r.actualMs != null);
  const segments = []; // {fromRow, toRow, addedMs, missingRows:[...]}
  let prev = null;
  rows.forEach(r => {
    if (r.actualMs != null) {
      if (prev) {
        const prevDelay = prev.actualMs - prev.plannedMs;
        const thisDelay = r.actualMs - r.plannedMs;
        const added = thisDelay - prevDelay;
        const between = rows.slice(rows.indexOf(prev)+1, rows.indexOf(r)).filter(x => x.actualMs == null);
        segments.push({ fromRow: prev, toRow: r, addedMs: added, missingRows: between });
      } else if (rows.indexOf(r) > 0) {
        // första skannade punkten — vad inträffade innan?
        const thisDelay = r.actualMs - r.plannedMs;
        const before = rows.slice(0, rows.indexOf(r)).filter(x => x.actualMs == null);
        if (before.length > 0 || thisDelay !== 0) {
          segments.push({ fromRow: null, toRow: r, addedMs: thisDelay, missingRows: before });
        }
      }
      prev = r;
    }
  });
  // Eventuella oskannade punkter efter sista skanningen
  const lastIdx = prev ? rows.indexOf(prev) : -1;
  if (prev && lastIdx < rows.length - 1) {
    const tail = rows.slice(lastIdx+1).filter(x => x.actualMs == null);
    if (tail.length > 0) segments.push({ fromRow: prev, toRow: null, addedMs: null, missingRows: tail });
  }

  let html = '';
  const lastScanned = rows.filter(r => r.s.actual).pop();
  if (lastScanned) {
    if (firstDelayKey) {
      const f = rows.find(r => r.p.key === firstDelayKey);
      const dTxt = f.p.mode === 'time' ? formatDelta(f.deltaMin) : formatDeltaDays(f.deltaDays);
      html += `<div class="summary bad"><strong>Försening uppstod här:</strong> ${esc(f.p.type)} – ${esc(f.p.label)} (${dTxt})</div>`;
    } else {
      html += `<div class="summary ok"><strong>I tid</strong> – inga försenade skanningspunkter hittills.</div>`;
    }
  } else {
    html += `<div class="summary"><span class="muted">Inga skanningstider angivna än.</span></div>`;
  }

  html += `<div class="card"><h3>Tidslinje</h3>
    <div class="timeline">
      <div class="timeline-row" style="border-bottom:1px solid var(--border); color:var(--muted)">
        <div></div><div>Punkt</div><div>Planerad</div><div>Faktisk skann</div><div>Avvikelse</div>
      </div>`;
  rows.forEach(r => {
    let cls = '', deltaTxt = '<span class="muted">–</span>', plannedTxt = '', inputHtml = '';
    if (r.p.mode === 'time') {
      plannedTxt = fmtDateTime(r.p.planned);
      inputHtml = `<input type="datetime-local" data-scan="${r.p.key}" data-mode="time" value="${r.s.actual||''}" style="font-size:12px">`;
      if (r.deltaMin != null) {
        cls = r.deltaMin > 15 ? 'bad' : r.deltaMin > 0 ? 'warn' : 'ok';
        deltaTxt = `<span class="delta-${cls}">${formatDelta(r.deltaMin)}</span>`;
      }
    } else {
      plannedTxt = r.p.plannedDate;
      inputHtml = `<input type="date" data-scan="${r.p.key}" data-mode="date" value="${r.s.actual||''}" style="font-size:12px">`;
      if (r.deltaDays != null) {
        cls = r.deltaDays > 0 ? 'bad' : r.deltaDays < 0 ? 'ok' : 'ok';
        deltaTxt = `<span class="delta-${cls}">${formatDeltaDays(r.deltaDays)}</span>`;
      }
    }
    html += `<div class="timeline-row">
      <div class="dot ${cls}"></div>
      <div><strong>${esc(r.p.type)}</strong><br><span class="muted">${esc(r.p.label)}</span></div>
      <div>${plannedTxt}</div>
      <div>${inputHtml}</div>
      <div>${deltaTxt}</div>
    </div>`;
  });
  html += `</div></div>`;

  // ===== Förseningsanalys =====
  if (scanned.length > 0) {
    html += `<div class="card"><h3>Förseningsanalys</h3>`;
    html += `<p class="muted">Visar var ny försening tillkommit. Inkrementell försening = skillnaden mellan total försening vid två på varandra följande skanningspunkter. Oskannade punkter mellan dem kan dölja var i segmentet det skedde.</p>`;
    html += `<ul style="line-height:1.7">`;

    segments.forEach(seg => {
      const fromTxt = seg.fromRow
        ? `<strong>${esc(seg.fromRow.p.type)}</strong> (${esc(seg.fromRow.p.label)})`
        : `<strong>Start</strong>`;
      const toTxt = seg.toRow
        ? `<strong>${esc(seg.toRow.p.type)}</strong> (${esc(seg.toRow.p.label)})`
        : `<strong>efter sista skanning</strong>`;

      if (seg.addedMs == null) {
        // Oskannad svans
        html += `<li>⚪ Mellan ${fromTxt} och slutet finns ${seg.missingRows.length} oskannad${seg.missingRows.length===1?'':'e'} punkt${seg.missingRows.length===1?'':'er'} – ingen information om vad som skett där.</li>`;
        return;
      }

      const addedMin = Math.round(seg.addedMs / 60000);
      const missingTxt = seg.missingRows.length > 0
        ? ` – passerar ${seg.missingRows.length} oskannad${seg.missingRows.length===1?' punkt':'a punkter'} (${seg.missingRows.map(r => esc(r.p.type)+' '+esc(r.p.label)).join('; ')}), så det går inte att säga exakt var i segmentet.`
        : ' – båda ändpunkterna är skannade, så förseningen tillkom i detta direkta steg.';

      if (Math.abs(addedMin) <= 15) {
        html += `<li>🟢 ${fromTxt} → ${toTxt}: ingen ny försening tillkom (${formatDelta(addedMin)}). Förseningen propagerades bara vidare.</li>`;
      } else if (addedMin > 15) {
        html += `<li>🔴 ${fromTxt} → ${toTxt}: <strong>+${formatDelta(addedMin).replace('+','')} extra försening tillkom här</strong>${missingTxt}</li>`;
      } else {
        html += `<li>🟡 ${fromTxt} → ${toTxt}: tid återhämtades (${formatDelta(addedMin)})${missingTxt}</li>`;
      }
    });

    // Specifik förklaring av propagation kontra ny försening, om både första försening och utkörning är skannade
    const firstDelayedRow = rows.find(r => r.delayed);
    const lastRow = scanned[scanned.length-1];
    if (firstDelayedRow && lastRow && firstDelayedRow !== lastRow) {
      const firstDelayMs = firstDelayedRow.actualMs - firstDelayedRow.plannedMs;
      const lastDelayMs = lastRow.actualMs - lastRow.plannedMs;
      const propagatedMin = Math.round(firstDelayMs / 60000);
      const finalMin = Math.round(lastDelayMs / 60000);
      const extraMin = finalMin - propagatedMin;
      html += `<li style="margin-top:8px; list-style:none; border-top:1px solid var(--border); padding-top:8px;">
        <strong>Totalt sett:</strong> Första kända försening var ${formatDelta(propagatedMin)} vid ${esc(firstDelayedRow.p.type)}. Vid sista skanningen (${esc(lastRow.p.type)}) är förseningen ${formatDelta(finalMin)}.
        ${Math.abs(extraMin) <= 15
          ? ' Inget tyder på ytterligare försening – den initiala förseningen propagerades bara.'
          : extraMin > 15
            ? ` Det är <strong>${formatDelta(extraMin)} mer</strong> än den initiala – ny försening har tillkommit längs vägen.`
            : ` Det är <strong>${formatDelta(extraMin)} mindre</strong> – tid har återhämtats.`}
      </li>`;
    }

    html += `</ul></div>`;
  }

  out.innerHTML = html;

  out.querySelectorAll('[data-scan]').forEach(inp => inp.onchange = () => {
    const key = inp.dataset.scan;
    let s = t.scans.find(x => x.key === key);
    if (!s) { s = { key, actual:'' }; t.scans.push(s); }
    s.actual = inp.value;
    // Remove empty scans to keep tidy
    t.scans = t.scans.filter(x => x.actual);
    save(); renderAnalyzeFor(id);
  });
}

// ============ UTILS ============
function combineDateTime(dateStr, timeStr, dayOffset=0) {
  // Local time
  const [y,m,d] = dateStr.split('-').map(Number);
  const [hh,mm] = timeStr.split(':').map(Number);
  const dt = new Date(y, m-1, d + dayOffset, hh, mm);
  return dt;
}
function fmtDateTime(d) {
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function formatDelta(min) {
  if (min === 0) return '±0 min';
  const sign = min > 0 ? '+' : '−';
  const a = Math.abs(min);
  if (a < 60) return `${sign}${a} min`;
  const h = Math.floor(a/60), m = a%60;
  return `${sign}${h}h ${m}min`;
}
function formatDeltaDays(d) {
  if (d === 0) return 'samma dag';
  const sign = d > 0 ? '+' : '−';
  const a = Math.abs(d);
  return `${sign}${a} ${a===1?'dag':'dagar'}`;
}
function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ============ INIT ============
function renderAll() {
  renderCarriers();
  refreshCarrierDropdowns();
  renderLines();
  renderTransports();
  renderAnalyze();
}
load();
renderWeekdayPicker();
clearLineForm();
renderAll();
</script>
